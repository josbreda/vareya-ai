name: IndexNow Submission

# Notifies IndexNow (Bing, Yandex, Seznam, Naver, etc — not Google, which
# does not consume IndexNow) of new/changed URLs after a production
# deploy. No credentials needed: the key is self-issued and lives at
# public/{key}.txt in this repo, which is also what proves ownership to
# IndexNow — there is nothing to configure in GitHub or Vercel for this
# workflow to run.

on:
  push:
    branches: [main]

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the Vercel deploy to finish
        # Submitting before the new sitemap is actually live would just
        # resubmit the previous version's URLs/lastmods — wait for the
        # "Vercel" commit status to resolve (success or failure) before
        # reading the live sitemap, same signal the merge workflow already
        # waits on elsewhere in this project.
        run: |
          for i in $(seq 1 40); do
            state=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/status" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','pending'))")
            echo "deploy state: $state"
            if [ "$state" = "success" ] || [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              break
            fi
            sleep 15
          done

      - name: Restore IndexNow submission state
        uses: actions/cache@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}
          restore-keys: |
            indexnow-state-

      - name: Submit changed URLs to IndexNow
        run: python3 scripts/indexnow-submit.py

      - name: Save IndexNow submission state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}
